name: Data check

on:
  push:
    paths:
      - "data/**"
      - "scripts/validate.py"
  pull_request:
    paths:
      - "data/**"
      - "scripts/validate.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check data/brands.json
        run: python3 scripts/validate.py
