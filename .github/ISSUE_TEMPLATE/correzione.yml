name: Chiedi una correzione / Request a correction
description: Segnala un errore, un'informazione superata o chiedi la rimozione di una voce.
title: "[Correzione] "
labels: ["correzione"]
body:
  - type: input
    id: entry
    attributes:
      label: Voce / Entry
      description: Il nome del brand o l'identificativo della voce. / The brand name or entry id.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Cosa non va? / What's wrong?
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Fonte a supporto / Supporting source
      placeholder: https://
  - type: dropdown
    id: role
    attributes:
      label: Scrivi per conto del brand? / Are you writing on behalf of the brand?
      options:
        - "No"
        - Sì / Yes
